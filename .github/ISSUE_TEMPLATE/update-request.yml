name: ⬆️ 请求更新上游版本
description: 上游 decolua/9router 发新版后，希望本仓库跟进打包
title: "更新# v"
labels: ["update-request"]
body:
  - type: markdown
    attributes:
      value: |
        感谢关注！在提交之前，请先确认下面两点 —— 大多数「求更新」都可以自己解决。

        ### 1. 先看 Releases 是不是已经有了

        本仓库的版本号**跟随上游**（上游 `v0.5.91` → 本仓库 Release `v0.5.91`）。
        最新版永远是这个地址，请先确认你要的版本确实还没发布：

        👉 <https://github.com/techysy/9router-fnos/releases/latest>

        如果你想要的版本已经在那里了，**不用提 issue**，直接下载安装即可。

        ### 2. 想要更新更快 / 功能更多？看 10Router

        本仓库是**纯上游打包**（只把上游源码打成 fpk，唯一改动是更新检查指向本仓库 Releases）。
        功能迭代、更完整的分发形态都在隔壁 **techysy/10router**，它同时提供：

        | 平台 | 产物 |
        |---|---|
        | 飞牛 fnOS | fpk（x86 / ARM × URL / iframe 四种） |
        | Windows | 安装版 / 便携版 / 在线安装器微端 |
        | macOS | Apple Silicon `arm64.dmg` / Intel `x64.dmg` |
        | Docker | `ghcr.io/techysy/10router:latest`（amd64 + arm64） |
        | npm | `npm i -g @techysy/10router` |

        👉 <https://github.com/techysy/10router/releases/latest>

  - type: input
    id: upstream-version
    attributes:
      label: 想要的上游版本号
      description: 上游 decolua/9router 的 tag / 版本，例如 v0.5.92
      placeholder: v0.5.92
    validations:
      required: true

  - type: checkboxes
    id: prechecked
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认该版本在 [本仓库 Releases](https://github.com/techysy/9router-fnos/releases/latest) 中**尚未发布**
          required: true
        - label: 我已知悉 10Router 提供了更完整的分发形态（含 Win/mac 客户端），如需可直接取用
          required: false
