name: Build & Release fpk

# 上游 decolua/9router 发新版后自动打包，产物发到本仓库 GitHub Releases。
#
#   schedule          每天轮询一次上游最新 tag（GitHub 定时任务在高峰期可能延迟，不保证准点）
#                     —— 已发过的版本靠幂等判断跳过，所以「每天跑」不会重复发版
#   workflow_dispatch 手动触发：可留空（自动探测上游最新 tag），也可指定 version 覆盖
#
# 幂等：探测到的版本若已有同版本 Release 则跳过；手动触发可勾 force 强制重打。

on:
  schedule:
    # 每天 03:23（UTC）跑一次；靠幂等 skip 保证不重复发版
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号（不带 v 前缀，留空=自动读上游最新 tag）"
        required: false
        type: string
      force:
        description: "已存在同版本 Release 时也强制重打"
        required: false
        type: boolean
        default: false

# 创建 Release / 上传产物需要写权限
permissions:
  contents: write

# 同一时间只跑一个构建，避免并发写同一 Release
concurrency:
  group: build-fpk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 探测上游最新 tag，判断是否需要打包 ──
      # 注意：手动输入通过 env 传入，不直接插值进 run（避免 script injection）。
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          UPSTREAM="https://github.com/decolua/9router.git"

          # 上游最新正式 tag：形如 v0.5.91（三段式纯数字，排除 rc/beta 等预发布）
          # 同时保留 tag 指向的 commit SHA，供 build.sh checkout + Release notes 引用。
          UP_LS="$(git ls-remote --tags --refs "${UPSTREAM}" | grep -E 'refs/tags/[vV]?[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -z "${UP_LS}" ]; then
            echo "ERROR: 无法从上游获取正式 tag" >&2
            exit 1
          fi
          # 按版本号自然排序取最大的一条
          UP_LINE="$(printf '%s\n' "${UP_LS}" | sort -k2 -V | tail -1)"
          UP_SHA="$(printf '%s' "${UP_LINE}" | awk '{print $1}')"
          UP_TAG="$(printf '%s' "${UP_LINE}" | sed 's#.*refs/tags/##')"
          UP_VER="${UP_TAG#[vV]}"
          echo "上游最新: ${UP_TAG} (${UP_SHA})"

          # 版本：手动输入优先，其次上游 tag
          VER="${IN_VERSION}"
          [ -n "${VER}" ] || VER="${UP_VER}"
          VER="${VER#v}"
          echo "本次打包版本: ${VER}"

          # 幂等：同版本 Release 已存在则跳过（除非 force）
          RELEASE_TAG="v${VER}"
          EXISTS=""
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            EXISTS="yes"
          else
            rc=$?
            # gh 的 404 退出码为 1（Release 不存在，属正常）；其余视为真实错误
            if [ "${rc}" -ne 1 ]; then
              echo "ERROR: 查询 Release 失败 (gh exit ${rc})" >&2
              exit 1
            fi
          fi
          if [ -n "${EXISTS}" ] && [ "${IN_FORCE}" != "true" ]; then
            echo "Release ${RELEASE_TAG} 已存在，跳过。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "version=${VER}"
            echo "tag=${RELEASE_TAG}"
            echo "upstream_tag=${UP_TAG}"
            echo "upstream_sha=${UP_SHA}"
          } >> "$GITHUB_OUTPUT"

      # ── 构建四个变体 ──
      # build.sh：克隆上游(--branch 锁定到 tag) → 打唯一补丁 → npm install + next build → fnpack
      - name: Build fpk variants
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          UPSTREAM_TAG: ${{ steps.resolve.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          chmod +x build.sh
          # UPSTREAM_TAG 让 build.sh 把上游源码锁到与版本号一致的 tag
          ./build.sh "${VERSION}" "" "${UPSTREAM_TAG}"

          # 断言四个变体齐全（缺一即失败，避免静默少传一个架构）
          echo "---- 产物校验 ----"
          for f in \
            "9router-${VERSION}-x86.fpk" \
            "9router-${VERSION}-iframe-x86.fpk" \
            "9router-${VERSION}-all.fpk" \
            "9router-${VERSION}-iframe-all.fpk"
          do
            if [ ! -f "${f}" ]; then
              echo "ERROR: 缺少产物 ${f}" >&2
              ls -lh || true
              exit 1
            fi
            echo "ok  ${f}"
          done

      # ── 构建产物留存（兜底：Publish 失败时仍可从 artifact 取回）──
      - name: Upload artifacts
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fpk-${{ steps.resolve.outputs.version }}
          path: 9router-*.fpk
          if-no-files-found: error
          retention-days: 14

      # ── 发布到本仓库 Releases ──
      - name: Publish Release
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VER: ${{ steps.resolve.outputs.version }}
          UP_TAG: ${{ steps.resolve.outputs.upstream_tag }}
          UP_SHA: ${{ steps.resolve.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          # 显式列出四个文件（不用通配符，避免静默漏传）
          FILES=(
            "9router-${VER}-x86.fpk"
            "9router-${VER}-iframe-x86.fpk"
            "9router-${VER}-all.fpk"
            "9router-${VER}-iframe-all.fpk"
          )
          for f in "${FILES[@]}"; do
            [ -f "${f}" ] || { echo "ERROR: 缺少产物 ${f}" >&2; exit 1; }
          done

          UP_TAG_URL="https://github.com/decolua/9router/releases/tag/${UP_TAG}"
          UP_SHA_URL="https://github.com/decolua/9router/commit/${UP_SHA}"
          NOTES="$(cat <<EOF
          由 CI 自动打包，跟随上游 [${UP_TAG}](${UP_TAG_URL})（commit \`${UP_SHA:0:10}\`）。

          | 文件 | 架构 | 桌面模式 |
          |------|------|---------|
          | \`9router-${VER}-x86.fpk\` | x86 | 浏览器打开，离线 |
          | \`9router-${VER}-iframe-x86.fpk\` | x86 | 桌面内嵌，离线 |
          | \`9router-${VER}-all.fpk\` | x86/ARM | 浏览器打开，在线构建 |
          | \`9router-${VER}-iframe-all.fpk\` | x86/ARM | 桌面内嵌，在线构建 |

          飞牛 **App Center → 手动安装** 选择对应 fpk。构建于上游 commit [${UP_SHA:0:10}](${UP_SHA_URL})。
          EOF
          )"

          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --title "${TAG}" \
            --notes "${NOTES}" \
            "${FILES[@]}"
