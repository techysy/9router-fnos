  <rect x="454" y="1108" width="22" height="4" rx="2" fill="var(--glue)"/>
  <text class="tiny" x="484" y="1118">fnOS 胶水（本仓库）</text>

  <rect x="656" y="1108" width="22" height="4" rx="2" fill="var(--pack)"/>
  <text class="tiny" x="686" y="1118">打包 / 发布</text>

  <rect x="800" y="1108" width="22" height="4" rx="2" fill="var(--down)"/>
  <text class="tiny" x="830" y="1118">持久化数据</text>

