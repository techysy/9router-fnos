  <!-- ── 底部图例 ── -->
  <line x1="36" y1="1100" x2="1044" y2="1100" stroke="var(--border)" stroke-width="1"/>
  <text class="tiny" x="36" y="1118" font-weight="600">图例</text>

  <rect x="78" y="1108" width="22" height="4" rx="2" fill="var(--build)"/>
  <text class="tiny" x="108" y="1118">源码 / 构建 / 运行时依赖</text>

  <rect x="278" y="1108" width="22" height="4" rx="2" fill="var(--patch)"/>
